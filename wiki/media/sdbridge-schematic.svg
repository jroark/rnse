<text x="165" y="186" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d1d1f">1 A or more</text>
<text x="165" y="204" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">(phone side only:</text>
<text x="165" y="220" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">SDSTREAM / SDPHONE)</text>
