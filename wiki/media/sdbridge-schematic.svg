<text x="270" y="384" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1d1f">GND</text>
<line x1="480.0" y1="526" x2="480.0" y2="560" stroke="#555" stroke-width="3"/>
<rect x="310.0" y="560" width="340" height="50" rx="6" fill="#f2f2f2" stroke="#555" stroke-width="2"/>
<text x="480.0" y="581" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d1d1f">OTG adapter: micro-USB (male) to USB-A (female)</text>
<text x="480.0" y="599" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d1d1f">then the phone's own USB-A to USB-C cable to the phone</text>
<text x="70" y="452" font-size="13" text-anchor="start" font-weight="bold" fill="#b00020">Never connect the slot's VDD (contact 4):</text>
<text x="70" y="470" font-size="13" text-anchor="start" font-weight="normal" fill="#b00020">the Pico has its own supply.</text>
<text x="70" y="496" font-size="12" text-anchor="start" font-weight="normal" fill="#555">Card firmware: power from the micro-USB</text>
<text x="70" y="512" font-size="12" text-anchor="start" font-weight="normal" fill="#555">(a computer, for the log).</text>
<text x="70" y="532" font-size="12" text-anchor="start" font-weight="normal" fill="#555">Phone firmware: 5 V on VBUS, the phone</text>
<text x="70" y="548" font-size="12" text-anchor="start" font-weight="normal" fill="#555">on the micro-USB. Never both at once.</text>
</svg>
