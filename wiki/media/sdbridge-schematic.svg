<text x="270" y="224" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1d1f">0 V</text>
<rect x="70" y="300" width="190" height="110" rx="6" fill="#f2f2f2" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<text x="165" y="326" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d1d1f">USB serial adapter</text>
<text x="165" y="346" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d1d1f">optional: the log</text>
<text x="165" y="364" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">115200 baud</text>
<line x1="260" y1="330" x2="366" y2="330" stroke="#1d1d1f" stroke-width="2" stroke-dasharray="6 4"/>
<text x="270" y="324" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1d1f">RX</text>
